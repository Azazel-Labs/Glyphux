<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 440" width="940" height="440" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<rect width="940" height="440" rx="10" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#6e7781"/></marker></defs>
<text x="20.0" y="30.0" font-size="15" fill="#24292f" text-anchor="start" font-weight="600">One texel's path through the buffers</text>
<text x="20.0" y="48.0" font-size="12" fill="#6e7781" text-anchor="start" font-weight="400">Glyph 1 ('p') of the batch above: work item 16 is its tile 0; the invocation for texel (3, 5) of that tile</text>
<rect x="20.0" y="70.0" width="206" height="118" rx="8" fill="#ffffff" stroke="#57606a" stroke-width="1.2"/>
<text x="32.0" y="90.0" font-size="13" fill="#24292f" text-anchor="start" font-weight="600">work</text>
<text x="216.0" y="90.0" font-size="10.5" fill="#6e7781" text-anchor="end" font-weight="400">binding 1</text>
<text x="32.0" y="112.0" font-size="11.5" fill="#e07b1f" text-anchor="start" font-weight="600">work[16] = (1, 0)</text>
<text x="32.0" y="129.0" font-size="11.5" fill="#6e7781" text-anchor="start" font-weight="400">one 8×8 workgroup per item,</text>
<text x="32.0" y="146.0" font-size="11.5" fill="#6e7781" text-anchor="start" font-weight="400">one invocation per texel</text>
<rect x="248.0" y="70.0" width="206" height="118" rx="8" fill="#ffffff" stroke="#57606a" stroke-width="1.2"/>
<text x="260.0" y="90.0" font-size="13" fill="#24292f" text-anchor="start" font-weight="600">glyphs</text>
<text x="444.0" y="90.0" font-size="10.5" fill="#6e7781" text-anchor="end" font-weight="400">binding 0</text>
<text x="260.0" y="112.0" font-size="11.5" fill="#e07b1f" text-anchor="start" font-weight="600">glyphs[1]</text>
<text x="260.0" y="129.0" font-size="11.5" fill="#6e7781" text-anchor="start" font-weight="400">22×31 texels, 3×4 tiles</text>
<text x="260.0" y="146.0" font-size="11.5" fill="#6e7781" text-anchor="start" font-weight="400">tile_offset 16, cand_offset 154</text>
<text x="260.0" y="163.0" font-size="11.5" fill="#6e7781" text-anchor="start" font-weight="400">edge_offset 13, field_offset 780</text>
<rect x="476.0" y="70.0" width="206" height="118" rx="8" fill="#ffffff" stroke="#57606a" stroke-width="1.2"/>
<text x="488.0" y="90.0" font-size="13" fill="#24292f" text-anchor="start" font-weight="600">tile_groups</text>
<text x="672.0" y="90.0" font-size="10.5" fill="#6e7781" text-anchor="end" font-weight="400">binding 5</text>
<text x="488.0" y="112.0" font-size="11.5" fill="#e07b1f" text-anchor="start" font-weight="600">[tile_offset + 0·2 + c]</text>
<text x="488.0" y="129.0" font-size="11.5" fill="#6e7781" text-anchor="start" font-weight="400">tile (0, 0): offset, count, and</text>
<text x="488.0" y="146.0" font-size="11.5" fill="#6e7781" text-anchor="start" font-weight="400">upper bounds per channel</text>
<text x="488.0" y="163.0" font-size="11.5" fill="#6e7781" text-anchor="start" font-weight="400">contour 0: 6 candidates</text>
<text x="488.0" y="180.0" font-size="11.5" fill="#6e7781" text-anchor="start" font-weight="400">contour 1: 4 candidates</text>
<rect x="704.0" y="70.0" width="206" height="118" rx="8" fill="#ffffff" stroke="#57606a" stroke-width="1.2"/>
<text x="716.0" y="90.0" font-size="13" fill="#24292f" text-anchor="start" font-weight="600">cands</text>
<text x="900.0" y="90.0" font-size="10.5" fill="#6e7781" text-anchor="end" font-weight="400">binding 6</text>
<text x="716.0" y="112.0" font-size="11.5" fill="#e07b1f" text-anchor="start" font-weight="600">[cand_offset + offset …]</text>
<text x="716.0" y="129.0" font-size="11.5" fill="#6e7781" text-anchor="start" font-weight="400">edges 0, 1, 2, 3, 4, 5</text>
<text x="716.0" y="146.0" font-size="11.5" fill="#6e7781" text-anchor="start" font-weight="400">sorted by lower bound: the scan</text>
<text x="716.0" y="163.0" font-size="11.5" fill="#6e7781" text-anchor="start" font-weight="400">stops when none can be nearer</text>
<rect x="704.0" y="248.0" width="206" height="118" rx="8" fill="#ffffff" stroke="#57606a" stroke-width="1.2"/>
<text x="716.0" y="268.0" font-size="13" fill="#24292f" text-anchor="start" font-weight="600">edges</text>
<text x="900.0" y="268.0" font-size="10.5" fill="#6e7781" text-anchor="end" font-weight="400">bindings 2, 3, 4</text>
<text x="716.0" y="290.0" font-size="11.5" fill="#e07b1f" text-anchor="start" font-weight="600">edges[edge_offset + i]</text>
<text x="716.0" y="307.0" font-size="11.5" fill="#6e7781" text-anchor="start" font-weight="400">lines, quadratics, cubics; cubics</text>
<text x="716.0" y="324.0" font-size="11.5" fill="#6e7781" text-anchor="start" font-weight="400">read their interval data from</text>
<text x="716.0" y="341.0" font-size="11.5" fill="#6e7781" text-anchor="start" font-weight="400">curves, the combiner contours</text>
<rect x="476.0" y="248.0" width="206" height="118" rx="8" fill="#ffffff" stroke="#57606a" stroke-width="1.2"/>
<text x="488.0" y="268.0" font-size="13" fill="#24292f" text-anchor="start" font-weight="600">field</text>
<text x="672.0" y="268.0" font-size="10.5" fill="#6e7781" text-anchor="end" font-weight="400">binding 7</text>
<text x="488.0" y="290.0" font-size="11.5" fill="#e07b1f" text-anchor="start" font-weight="600">field[field_offset + 5·22 + 3]</text>
<text x="488.0" y="307.0" font-size="11.5" fill="#6e7781" text-anchor="start" font-weight="400">vec4: MSDF in rgb,</text>
<text x="488.0" y="324.0" font-size="11.5" fill="#6e7781" text-anchor="start" font-weight="400">true distance in a</text>
<rect x="248.0" y="248.0" width="206" height="118" rx="8" fill="#ffffff" stroke="#57606a" stroke-width="1.2"/>
<text x="260.0" y="268.0" font-size="13" fill="#24292f" text-anchor="start" font-weight="600">stencil</text>
<text x="444.0" y="268.0" font-size="10.5" fill="#6e7781" text-anchor="end" font-weight="400">binding 8</text>
<text x="260.0" y="290.0" font-size="11.5" fill="#e07b1f" text-anchor="start" font-weight="600">stencil[field_offset + 5·22 + 3]</text>
<text x="260.0" y="307.0" font-size="11.5" fill="#6e7781" text-anchor="start" font-weight="400">error correction flags: protected</text>
<text x="260.0" y="324.0" font-size="11.5" fill="#6e7781" text-anchor="start" font-weight="400">(corners from binding 9, edges),</text>
<text x="260.0" y="341.0" font-size="11.5" fill="#6e7781" text-anchor="start" font-weight="400">artifact; artifacts → median</text>
<rect x="20.0" y="248.0" width="206" height="118" rx="8" fill="#ffffff" stroke="#c98a1c" stroke-width="1.2"/>
<text x="32.0" y="268.0" font-size="13" fill="#24292f" text-anchor="start" font-weight="600">atlas texture</text>
<text x="216.0" y="268.0" font-size="10.5" fill="#6e7781" text-anchor="end" font-weight="400">texture</text>
<text x="32.0" y="290.0" font-size="11.5" fill="#e07b1f" text-anchor="start" font-weight="600">layer atlas_layer, at</text>
<text x="32.0" y="307.0" font-size="11.5" fill="#6e7781" text-anchor="start" font-weight="400">(atlas_x + 3, atlas_y + 5)</text>
<text x="32.0" y="324.0" font-size="11.5" fill="#6e7781" text-anchor="start" font-weight="400">the store pass clamps to the</text>
<text x="32.0" y="341.0" font-size="11.5" fill="#6e7781" text-anchor="start" font-weight="400">format (rgba8 or rgba16f)</text>
<path d="M226.0,129.0H245.0" stroke="#6e7781" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>
<path d="M454.0,129.0H473.0" stroke="#6e7781" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>
<path d="M682.0,129.0H701.0" stroke="#6e7781" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>
<path d="M807.0,188.0V245.0" stroke="#6e7781" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>
<path d="M704.0,307.0H685.0" stroke="#6e7781" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>
<path d="M476.0,307.0H457.0" stroke="#6e7781" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>
<path d="M248.0,307.0H229.0" stroke="#6e7781" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>
<text x="20.0" y="400.0" font-size="12" fill="#6e7781" text-anchor="start" font-weight="400">Every array is shared by the whole batch: a glyph's record holds its offsets into them, so one dispatch covers all glyphs.</text>
</svg>
