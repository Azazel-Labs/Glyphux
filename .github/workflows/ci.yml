# Formatting, lints and tests for the workspace, a fully optimized build of the web demo, and,
# on pushes to main once both pass, its deployment to GitHub Pages.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # The binaryen release whose wasm-opt optimizes the web demo.
  BINARYEN_VERSION: "123"

jobs:
  check:
    name: Format, lint, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # rust-toolchain.toml: stable with rustfmt, clippy and rust-src.
      - run: rustup toolchain install --no-self-update
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo fmt --check
        working-directory: examples/web-demo
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      # Unit, integration and naga shader validation tests; the GPU tests skip themselves when
      # the runner has no adapter.
      - run: cargo test --workspace --release

  web-demo:
    name: Web demo (wasm)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/web-demo
    steps:
      - uses: actions/checkout@v4
      # The demo's rust-toolchain.toml adds the wasm32-unknown-unknown target.
      - run: rustup toolchain install --no-self-update
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: examples/web-demo
      - run: cargo clippy --release -- -D warnings
      - run: cargo build --release
      - name: Install wasm-bindgen (the version in Cargo.lock)
        run: |
          v=$(cargo pkgid wasm-bindgen | sed 's/.*@//')
          if [ "$(wasm-bindgen --version 2>/dev/null)" != "wasm-bindgen $v" ]; then
            cargo install wasm-bindgen-cli --version "$v" --locked
          fi
      - name: Install wasm-opt (binaryen)
        run: |
          curl -sSfL "https://github.com/WebAssembly/binaryen/releases/download/version_${BINARYEN_VERSION}/binaryen-version_${BINARYEN_VERSION}-x86_64-linux.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/binaryen-version_${BINARYEN_VERSION}/bin" >> "$GITHUB_PATH"
      - name: Bind and optimize
        run: |
          wasm-bindgen --target web --no-typescript --out-dir pkg \
            target/wasm32-unknown-unknown/release/msdfr_gpu_web_demo.wasm
          wasm-opt -O3 --enable-simd --enable-bulk-memory --enable-nontrapping-float-to-int \
            --enable-sign-ext --enable-mutable-globals --enable-reference-types --enable-multivalue \
            pkg/msdfr_gpu_web_demo_bg.wasm -o pkg/msdfr_gpu_web_demo_bg.wasm
          ls -l pkg
      - name: Assemble the site
        run: |
          mkdir -p "$RUNNER_TEMP/site"
          cp -r index.html pkg assets "$RUNNER_TEMP/site/"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/site

  deploy:
    name: Deploy to GitHub Pages
    needs: [check, web-demo]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # One deployment at a time, and a running one is never cancelled halfway.
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
