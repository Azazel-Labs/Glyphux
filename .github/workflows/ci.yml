# Formatting, lints and tests for the workspace, a fully optimized build of the web demo, and,
# on pushes to main once both pass, its deployment to GitHub Pages. Published GitHub
# releases publish the workspace to crates.io after all three validation jobs pass.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  # A manual CI run must not cancel a release while crates are being uploaded.
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'release' }}

env:
  CARGO_TERM_COLOR: always
  # The binaryen release whose wasm-opt optimizes the web demo.
  BINARYEN_VERSION: "123"

jobs:
  check:
    name: Format, lint, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # rust-toolchain.toml: stable with rustfmt, clippy and rust-src.
      - run: rustup toolchain install --no-self-update
      - uses: Swatinem/rust-cache@v2
      - name: Check release version
        if: github.event_name == 'release'
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python3 - <<'PY'
          import os
          import pathlib
          import tomllib

          root = tomllib.loads(pathlib.Path("Cargo.toml").read_text())
          version = root["workspace"]["package"]["version"]
          expected = f"v{version}"
          if os.environ["RELEASE_TAG"] != expected:
              raise SystemExit(f"Release tag must be {expected}")
          for manifest in pathlib.Path("crates").glob("*/Cargo.toml"):
              package = tomllib.loads(manifest.read_text())["package"]
              if package["version"] != {"workspace": True}:
                  raise SystemExit(f"{manifest}: version must inherit from the workspace")
          for name, dependency in root["workspace"]["dependencies"].items():
              if "path" in dependency and dependency.get("version") != version:
                  raise SystemExit(f"{name}: dependency version must be {version}")
          PY
      - run: cargo fmt --all --check
      - run: cargo fmt --check
        working-directory: examples/web-demo
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      # glyphux's optional features: without fonts, and with only the GPU data.
      - run: cargo check -p glyphux --no-default-features --all-targets
      - run: cargo check -p glyphux --no-default-features --features gpu --all-targets
      - run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
      # Unit, integration, doc and naga shader validation tests; the GPU tests skip themselves
      # when the runner has no adapter.
      - run: cargo test --workspace --release

  msrv:
    name: Minimum Rust versions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The manifests' rust-version: 1.85 for the core crates, 1.93 for glyphux-gpu (wgpu 30).
      - run: rustup toolchain install 1.85 1.93 --profile minimal --no-self-update
      - uses: Swatinem/rust-cache@v2
      - run: cargo +1.85 check -p glyphux -p glyphux-atlas -p glyphux-cli --all-targets
      - run: cargo +1.93 check -p glyphux-gpu -p glyphux-examples --all-targets

  web-demo:
    name: Web demo (wasm)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/web-demo
    steps:
      - uses: actions/checkout@v4
      # The demo's rust-toolchain.toml adds the wasm32-unknown-unknown target.
      - run: rustup toolchain install --no-self-update
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: examples/web-demo
      - run: cargo clippy --release -- -D warnings
      - run: cargo build --release
      - name: Install wasm-bindgen (the version in Cargo.lock)
        run: |
          v=$(cargo pkgid wasm-bindgen | sed 's/.*@//')
          if [ "$(wasm-bindgen --version 2>/dev/null)" != "wasm-bindgen $v" ]; then
            cargo install wasm-bindgen-cli --version "$v" --locked
          fi
      - name: Install wasm-opt (binaryen)
        run: |
          curl -sSfL "https://github.com/WebAssembly/binaryen/releases/download/version_${BINARYEN_VERSION}/binaryen-version_${BINARYEN_VERSION}-x86_64-linux.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/binaryen-version_${BINARYEN_VERSION}/bin" >> "$GITHUB_PATH"
      - name: Bind and optimize
        run: |
          wasm-bindgen --target web --no-typescript --out-dir pkg \
            target/wasm32-unknown-unknown/release/glyphux_gpu_web_demo.wasm
          wasm-opt -O3 --enable-simd --enable-bulk-memory --enable-nontrapping-float-to-int \
            --enable-sign-ext --enable-mutable-globals --enable-reference-types --enable-multivalue \
            pkg/glyphux_gpu_web_demo_bg.wasm -o pkg/glyphux_gpu_web_demo_bg.wasm
          ls -l pkg
      - name: Assemble the site
        run: |
          mkdir -p "$RUNNER_TEMP/site"
          cp -r index.html pkg assets "$RUNNER_TEMP/site/"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/site

  deploy:
    name: Deploy to GitHub Pages
    needs: [check, web-demo]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # One deployment at a time, and a running one is never cancelled halfway.
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  publish:
    name: Publish crates.io release
    needs: [check, msrv, web-demo]
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    # Serialize releases, including releases with different tags.
    concurrency:
      group: crates-io-publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install --no-self-update
      - uses: Swatinem/rust-cache@v2
      # Cargo verifies every package before uploading and handles dependency order.
      # The examples are excluded by their publish = false manifests.
      - name: Verify crate packages
        run: cargo publish --workspace --locked --dry-run
      - name: Publish crates
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -z "$CARGO_REGISTRY_TOKEN" ]; then
            echo "::error::Add the CARGO_REGISTRY_TOKEN repository Actions secret before publishing."
            exit 1
          fi
          cargo publish --workspace --locked
