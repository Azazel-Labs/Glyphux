# Inside the Glyphux repository, the plugin's crate builds against the glyphux-gpu beside it
# rather than the release its Cargo.toml names (which a copy of the plugin elsewhere fetches
# from crates.io). Cargo finds this file from the crate's folder, where Glyphux.Build.cs runs it.
[patch.crates-io]
glyphux-gpu = { path = "../../crates/glyphux-gpu" }
