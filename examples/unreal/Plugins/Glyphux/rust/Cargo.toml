[package]
name = "glyphux-unreal"
version = "0.4.1"
edition = "2024"
rust-version = "1.94"
publish = false
license = "MIT"
repository = "https://github.com/Azazel-Labs/Glyphux"
description = "The Rust half of the Glyphux Unreal Engine plugin: text layout, the glyph atlas and its GPU batches, glyph records for the materials"

[lib]
# The plugin's module (Source/Glyphux) links the static library.
crate-type = ["staticlib", "rlib"]

[dependencies]
# glyphux-gpu from Glyphux's repository, pinned to a commit with the HLSL output (not yet in a
# release), so the plugin builds wherever it is copied. Inside the repository,
# examples/unreal/.cargo/config.toml patches it to the crate beside it. Move both pins together.
glyphux-gpu = { git = "https://github.com/Azazel-Labs/Glyphux", rev = "97035d6442e17a7dda375b329f3df71fa2730458" }
# Ferreal (UCLASSes in Rust), from its repository until it is published, pinned to a commit
# of its main branch (move both this and ferreal-build below together).
ferreal = { git = "https://github.com/Azazel-Labs/Ferreal", rev = "210fcee5aa815598a8d6c4afe199be9e1d194160" }

[build-dependencies]
glyphux-gpu = { git = "https://github.com/Azazel-Labs/Glyphux", rev = "97035d6442e17a7dda375b329f3df71fa2730458", default-features = false, features = ["hlsl"] }
ferreal-build = { git = "https://github.com/Azazel-Labs/Ferreal", rev = "210fcee5aa815598a8d6c4afe199be9e1d194160" }

# Its own workspace (the Glyphux workspace excludes it).
[workspace]

# What the plugin's Build.cs builds: optimized, with unwinding, so that a panic in Rust is
# caught at the boundary and logged instead of taking the editor down.
[profile.unreal]
inherits = "release"
panic = "unwind"
codegen-units = 1
lto = "thin"
debug = "line-tables-only"

[lints.rust]
rust_2018_idioms = { level = "warn", priority = -1 }
unused_qualifications = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
