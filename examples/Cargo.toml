[package]
name = "textra-examples"
description = "Runnable demos of textra and textra-gpu (cargo run --release --bin <name>)"
version.workspace = true
edition.workspace = true
rust-version = "1.93"
license.workspace = true
publish = false

[dependencies]
textra.workspace = true
textra-gpu = { workspace = true, features = ["demo"] }

[[bin]]
name = "glyph"
path = "glyph.rs"
doc = false

[[bin]]
name = "color_glyph"
path = "color_glyph.rs"
doc = false

[[bin]]
name = "text_demo"
path = "text_demo.rs"
doc = false

[[bin]]
name = "glyph_zoom"
path = "glyph_zoom.rs"
doc = false

[[bin]]
name = "shaping_demo"
path = "shaping_demo.rs"
doc = false

[[bin]]
name = "figures"
path = "figures.rs"
doc = false

[lints]
workspace = true
