[package]
name = "glyphux-gpu"
version.workspace = true
edition.workspace = true
rust-version = "1.93"
license.workspace = true
repository.workspace = true
description = "GPU (wgpu / WGSL compute) generation of SDF, PSDF, MSDF and MTSDF glyphs for glyphux, with an atlas cache and text rendering"
keywords = ["msdf", "sdf", "wgpu", "font", "text-rendering"]
categories = ["graphics", "rendering"]

[features]
default = ["wgpu-default", "shaping"]
# wgpu's default backends (Vulkan, Metal, DX12, GLES, WebGPU). Disable to pick your own via
# your application's wgpu dependency.
wgpu-default = ["wgpu/default"]
# OpenType text shaping with HarfRust (HarfBuzz's Rust port): ligatures, kerning (GPOS),
# marks, complex scripts, right-to-left.
shaping = ["dep:harfrust", "dep:unicode-bidi"]
# Animated text scene used by the demos (examples/text_demo.rs, ../../examples/web-demo).
demo = ["shaping"]

[dependencies]
glyphux = { workspace = true, features = ["gpu"] }
bytemuck.workspace = true
wgpu.workspace = true
harfrust = { version = "0.14", default-features = false, features = ["std"], optional = true }
unicode-bidi = { version = "0.3", optional = true }

[dev-dependencies]
naga.workspace = true

[lints]
workspace = true
