[package]
name = "textra-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Command line tools for textra: textra (single shapes, msdfgen compatible) and textra-atlas (font atlases, msdf-atlas-gen compatible)"
keywords = ["msdf", "sdf", "font", "atlas", "cli"]
categories = ["command-line-utilities", "graphics"]

[dependencies]
textra = { workspace = true, features = ["font"] }
textra-atlas.workspace = true
clap.workspace = true

# The binaries share their names with the library crates: documenting them would
# overwrite those crates' docs (cargo#6313).
[[bin]]
name = "textra"
path = "src/bin/textra.rs"
doc = false

[[bin]]
name = "textra-atlas"
path = "src/bin/textra-atlas.rs"
doc = false

[lints]
workspace = true
