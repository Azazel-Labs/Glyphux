[package]
name = "msdfr"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Pure Rust multi-channel signed distance field generator (SDF, PSDF, MSDF, MTSDF) - a fast, dependency-light take on msdfgen"
keywords = ["msdf", "sdf", "font", "distance-field", "text-rendering"]
categories = ["graphics", "rendering", "text-processing"]
readme = "../../README.md"

[features]
default = ["font"]
# TrueType / OpenType glyph loading via the pure-Rust `ttf-parser` crate.
font = ["dep:ttf-parser"]
# GPU-ready shape and tile data (`msdfr::gpu`), used by msdfr-gpu. Adds `bytemuck`.
gpu = ["dep:bytemuck"]

[dependencies]
ttf-parser = { version = "0.25", optional = true, default-features = false, features = ["std", "variable-fonts"] }
bytemuck = { workspace = true, optional = true }

[[bench]]
name = "glyphs"
harness = false
required-features = ["font"]

[lints]
workspace = true
